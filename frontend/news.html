<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News — Tirur Connect</title><link rel="stylesheet" href="css/style.css"></head><body><div data-chrome="topbar" class="topbar"></div><header data-chrome="header" class="site-header"></header><main><section class="section"><div class="container"><div class="section-head"><h1>News</h1><input id="search" placeholder="Search news"></div><div class="grid" id="newsList"></div></div></section></main><footer data-chrome="footer" class="site-footer"></footer><nav data-chrome="tabbar" class="tabbar"></nav><script src="js/app.js"></script><script>
renderChrome('home');
const base = 'http://localhost:5001/api';
const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
async function loadNews() { const params = new URLSearchParams(); if (search.value.trim()) params.set('search', search.value.trim()); const response = await fetch(`${base}/news?${params}`); const result = await response.json().catch(() => ({})); const items = result.data || []; newsList.innerHTML = items.length ? items.map((item) => `<a class="card" href="news.html?slug=${encodeURIComponent(item.slug)}"><img src="${escapeHtml(item.image)}" alt="" style="width:100%;height:150px;object-fit:cover;"><span class="tag">${escapeHtml(item.category || 'News')}</span><h3>${escapeHtml(item.title)}</h3><p class="text-soft">${escapeHtml(item.description || item.summary)}</p><small>${item.publishedAt ? new Date(item.publishedAt).toLocaleDateString() : ''}</small></a>`).join('') : '<div class="empty-state">No news available.</div>'; }
const slug = new URLSearchParams(location.search).get('slug'); const search = document.getElementById('search'); const newsList = document.getElementById('newsList'); search.oninput = loadNews;
if (slug) fetch(`${base}/news/${encodeURIComponent(slug)}`).then((response) => response.json()).then((result) => { const item = result.news; newsList.innerHTML = item ? `<article class="card"><span class="tag">${escapeHtml(item.category || 'News')}</span><h1>${escapeHtml(item.title)}</h1><p class="text-soft">${escapeHtml(item.publishedAt ? new Date(item.publishedAt).toLocaleDateString() : '')}</p>${item.image ? `<img src="${escapeHtml(item.image)}" alt="" style="width:100%;max-height:360px;object-fit:cover;">` : ''}<p>${escapeHtml(item.description || item.summary)}</p><div>${escapeHtml(item.content)}</div></article>` : '<div class="empty-state">No news available.</div>'; }); else loadNews();
</script></body></html>
