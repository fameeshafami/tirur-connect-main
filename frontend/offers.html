<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offers — Tirur Connect</title><link rel="stylesheet" href="css/style.css"></head><body><div data-chrome="topbar" class="topbar"></div><header data-chrome="header" class="site-header"></header><main><section class="section"><div class="container"><div class="section-head"><h1>Offers</h1><select id="category"><option value="">All Categories</option><option value="education">Education</option><option value="electronics">Electronics</option><option value="food">Food</option><option value="coffee">Coffee</option><option value="offers">Offers</option><option value="local">Local</option></select></div><div class="grid" id="offerList"></div></div></section></main><footer data-chrome="footer" class="site-footer"></footer><nav data-chrome="tabbar" class="tabbar"></nav><script src="js/app.js"></script><script>
renderChrome('home'); const base = 'http://localhost:5001/api'; const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char])); async function loadOffers(){const query=category.value ? `?category=${encodeURIComponent(category.value)}` : ''; const response=await fetch(`${base}/offers${query}`); const result=await response.json().catch(()=>({})); const items=result.data||[]; offerList.innerHTML=items.length?items.map((item)=>`<a class="card" href="${escapeHtml(item.link||'#')}">${item.image?`<img src="${escapeHtml(item.image)}" alt="" style="width:100%;height:150px;object-fit:cover;">`:''}<span class="tag">${escapeHtml(item.category||'Offer')}</span><h3>${escapeHtml(item.title)}</h3><p class="text-soft">${escapeHtml(item.description)}</p><small>${new Date(item.startDate).toLocaleDateString()} – ${new Date(item.endDate).toLocaleDateString()}</small></a>`).join(''):'<div class="empty-state">No offers available.</div>';} const category=document.getElementById('category'); const offerList=document.getElementById('offerList'); category.onchange=loadOffers; loadOffers();
</script></body></html>
