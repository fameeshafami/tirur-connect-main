<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Tirur Connect</title>
<link rel="icon" type="image/svg+xml" href="assets/tirur-connect-icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-chrome="topbar" class="topbar"></div>
<header data-chrome="header" class="site-header"></header>
<main><section class="section"><div class="container" style="max-width:460px;"><div class="form-card">
  <h2 style="font-size:18px;">Create a new password</h2>
  <p class="text-soft">Choose a new password for your Tirur Connect account.</p>
  <form id="resetForm" class="mt-16" novalidate>
    <div class="form-group"><label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <p id="resetMessage" class="text-soft" role="alert" aria-live="polite" style="display:none;"></p>
    <button class="btn btn-primary btn-block" type="submit">Reset Password</button>
  </form>
</div></div></section></main>
<footer data-chrome="footer" class="site-footer"></footer>
<script src="js/app.js"></script>
<script>
renderChrome('login');
const form = document.getElementById('resetForm');
const message = document.getElementById('resetMessage');
const token = new URLSearchParams(location.search).get('token');
form.addEventListener('submit', async (event)=>{
  event.preventDefault();
  message.style.display = 'none';
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if(newPassword.length < 8){ message.textContent = 'Password must be at least 8 characters long.'; message.style.display = 'block'; return; }
  if(newPassword !== confirmPassword){ message.textContent = 'Passwords do not match.'; message.style.display = 'block'; return; }
  try{
    const response = await fetch('http://localhost:5001/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ token, newPassword }) });
    const data = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.message || 'Unable to reset password.');
    message.textContent = data.message;
    message.style.display = 'block';
    form.reset();
    setTimeout(()=>{ window.location.href = 'login.html'; }, 1200);
  }catch(error){ message.textContent = error.message; message.style.display = 'block'; }
});
</script>
</body>
</html>
